name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-ci:
    name: Lint + Test + Coverage
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    env:
      NODE_ENV: test
      # Fake JWT secrets — safe for CI (no real data, just crypto strings)
      JWT_SECRET: ci-fake-jwt-secret-minimum-32-characters-long
      JWT_REFRESH_SECRET: ci-fake-refresh-secret-minimum-32-characters-long
      JWT_EXPIRE: 7d
      JWT_REFRESH_EXPIRE: 30d
      FRONTEND_URL: http://localhost:3000
      PORT: 5000
      # Redis
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # MongoDB
      MONGODB_URI: mongodb://localhost:27017/capsule-test
      # Cloudinary (dummy values for testing)
      CLOUDINARY_URL: cloudinary://123456789012345:abcdefghijklmnopqrstuvwxyz123456@test-cloud
      CLOUDINARY_CLOUD_NAME: test-cloud
      CLOUDINARY_API_KEY: 123456789012345
      CLOUDINARY_API_SECRET: abcdefghijklmnopqrstuvwxyz123456
      # Resend Email (dummy value for testing)
      RESEND_API_KEY: re_test_key_for_ci_testing_only
      FROM_EMAIL: test@example.com
      FROM_NAME: Test Capsule

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (fail on any warning)
        run: npm run lint

      - name: Run tests with coverage
        run: npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-${{ github.run_number }}
          path: backend/coverage/
          retention-days: 30
